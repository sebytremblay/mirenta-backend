[project]
name = "mirenta-livekit-voice-agent"
version = "0.1.0"
description = "Mirenta inbound voice agent for LiveKit Cloud (Deepgram STT/TTS + OpenAI LLM)"
requires-python = ">=3.13,<3.15"
dependencies = [
    "livekit-agents[silero]>=1.6.1",
    "livekit-plugins-deepgram>=1.6.1",
    "livekit-plugins-openai>=1.6.1",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py313"

# Nested project: basedpyright/pyright must use this venv (not the repo-root .venv).
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
extraPaths = ["src"]
