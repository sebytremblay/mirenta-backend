name: Deploy Temporal worker

# Keep the deployed Temporal worker in sync with main. Production Temporal is
# Temporal Cloud (managed, nothing to self-deploy); the piece that goes stale is
# the worker process (worker/main.py), which registers ContactLoopWorkflow,
# TaskExecutionWorkflow, and their activities. The API on Render auto-deploys
# from main but never runs the worker (app/main.py's lifespan starts nothing
# Temporal-related), so the worker ships as its own deployment. A change to
# workflow, activity, or worker code that merges without a worker redeploy
# leaves the loop running older code.
#
# This job triggers that redeploy by calling the worker service's Render
# deploy hook. Store the hook URL as the RENDER_TEMPORAL_WORKER_DEPLOY_HOOK
# repository secret (Render dashboard -> worker service -> Settings -> Deploy
# Hook). When the secret is absent the job logs and exits cleanly rather than
# failing, so forks and unconfigured environments stay green.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "workflows/**"
      - "activities/**"
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-temporal-worker.yml"
  # Allow a manual redeploy from the Actions tab without a code change.
  workflow_dispatch:

concurrency:
  group: deploy-temporal-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_TEMPORAL_WORKER_DEPLOY_HOOK }}
        run: |
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "RENDER_TEMPORAL_WORKER_DEPLOY_HOOK is not set; skipping redeploy." >&2
            exit 0
          fi
          echo "Triggering Temporal worker redeploy."
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${DEPLOY_HOOK}")
          echo "Render deploy hook responded with HTTP ${status}."
          case "${status}" in
            2*) echo "Redeploy queued." ;;
            *) echo "Render deploy hook failed with HTTP ${status}." >&2; exit 1 ;;
          esac
